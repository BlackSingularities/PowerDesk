name: Build & Release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  # Nowy commit anuluje budowę w toku – budujemy i wydajemy tylko najnowszy stan.
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # 32-bitowa biblioteka okien „Otwórz”/„Zapisz jako” dla programów 32-bitowych.
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # Wersja: MAJOR.MINOR z app/Cargo.toml. Pierwsze wydanie danej linii dostaje dokładnie tę wersję
      # (np. 1.0.0), każde kolejne – następny numer poprawki (1.0.1, 1.0.2…) na podstawie istniejących wydań.
      - name: Wersja
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Select-String -Path app/Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $parts = $ver.Split('.')
          $line = "$($parts[0]).$($parts[1])"
          $tags = @(gh release list --limit 200 --json tagName --jq '.[].tagName' 2>$null)
          $nums = $tags | Where-Object { $_ -match "^v$([regex]::Escape($line))\.(\d+)$" } | ForEach-Object { [int]($_ -replace "^v$([regex]::Escape($line))\.", '') }
          if ($nums) { $patch = ($nums | Measure-Object -Maximum).Maximum + 1 } else { $patch = [int]$parts[2] }
          $v = "$line.$patch"
          "version=$v" >> $env:GITHUB_OUTPUT

      # Testy w profilu wydania – te same skompilowane zależności co budowa PowerDesk niżej.
      - name: Testy silnika synchronizacji
        run: cargo test --release -p powerdesk-core --test sync_core

      # PowerDesk (natywny, Slint). Aktualizacje idą przez redzikowski.com, bez klucza w programie.
      # Biblioteka okien „Otwórz”/„Zapisz jako” (skrzynka dialog) w obu architekturach – osadzana
      # w powerdesk.exe przez core/build.rs, więc wydanie nadal ma jeden plik instalatora.
      - name: Build biblioteki okien plików
        shell: pwsh
        run: |
          cargo build --release -p powerdesk-dialog --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Budowa 64-bitowej biblioteki nie powiodła się" }
          cargo build --release -p powerdesk-dialog --target i686-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Budowa 32-bitowej biblioteki nie powiodła się" }
          "POWERDESK_DIALOG_DLL64=$PWD/target/x86_64-pc-windows-msvc/release/powerdesk_dialog.dll" >> $env:GITHUB_ENV
          "POWERDESK_DIALOG_DLL32=$PWD/target/i686-pc-windows-msvc/release/powerdesk_dialog.dll" >> $env:GITHUB_ENV

      - name: Build PowerDesk
        env:
          POWERDESK_VERSION: ${{ steps.ver.outputs.version }}
        run: cargo build --release -p powerdesk

      - name: Pliki wydania
        shell: pwsh
        env:
          WIN_CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
          WIN_CERT_PASS: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory out | Out-Null
          # Jedyny plik wydania: instalator (ten sam program – przy uruchomieniu instaluje się
          # w Program Files albo aktualizuje istniejącą instalację w tym samym miejscu).
          Copy-Item "target/release/powerdesk.exe" "out/PowerDesk-Setup-$v.exe"
          # Podpis cyfrowy (bez ostrzeżeń SmartScreen) – tylko gdy w sekretach repozytorium jest certyfikat:
          # WINDOWS_CERTIFICATE (plik .pfx w base64) i WINDOWS_CERTIFICATE_PASSWORD.
          if ($env:WIN_CERT) {
            $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CERT))
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
            & $signtool.FullName sign /f $pfx /p $env:WIN_CERT_PASS /fd sha256 /tr http://timestamp.digicert.com /td sha256 /d "PowerDesk" (Get-ChildItem out/*.exe).FullName
            if ($LASTEXITCODE -ne 0) { throw "Podpisywanie nie powiodło się" }
            Remove-Item $pfx
          }
          # Suma SHA-256 trafia do opisu wydania (program sprawdza ją przed aktualizacją) – bez osobnego pliku.
          New-Item -ItemType Directory meta | Out-Null
          Get-FileHash out/*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content meta/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PowerDesk-${{ steps.ver.outputs.version }}
          path: out/*

      - name: Wydanie
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message || '', '[skip release]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "v${{ steps.ver.outputs.version }}"
          $sum = (Get-Content meta/sha256.txt -Raw).Trim()
          $notes = "Automatyczne wydanie z commita ${{ github.sha }}.`n`n**PowerDesk-Setup-*.exe** – instalator: instaluje PowerDesk w Program Files (Windows zapyta o uprawnienia administratora), a kolejne wersje aktualizuje w tym samym miejscu – także samoczynnie z programu. Zastępuje OpenFilePower – przenosi jego ustawienia i proponuje odinstalowanie.`n`nSHA-256: ``$sum``"
          gh release create $v out/* --title "PowerDesk $v" --notes $notes --target ${{ github.sha }}
