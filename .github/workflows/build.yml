name: Build & Release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Wersja: MAJOR.MINOR z package.json. Pierwsze wydanie danej linii dostaje dokładnie wersję z package.json
      # (np. 1.0.0), każde kolejne – następny numer poprawki (1.0.1, 1.0.2…) na podstawie istniejących wydań.
      - name: Wersja
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $parts = $pkg.version.Split('.')
          $line = "$($parts[0]).$($parts[1])"
          $tags = @(gh release list --limit 200 --json tagName --jq '.[].tagName' 2>$null)
          $nums = $tags | Where-Object { $_ -match "^v$([regex]::Escape($line))\.(\d+)$" } | ForEach-Object { [int]($_ -replace "^v$([regex]::Escape($line))\.", '') }
          if ($nums) { $patch = ($nums | Measure-Object -Maximum).Maximum + 1 } else { $patch = [int]$parts[2] }
          $v = "$line.$patch"
          (Get-Content package.json -Raw) -replace '"version": "[^"]+"', "`"version`": `"$v`"" | Set-Content package.json -NoNewline
          "version=$v" >> $env:GITHUB_OUTPUT

      - run: npm ci
      - name: Sprawdzenie typów
        run: npm run check
      - name: Testy silnika synchronizacji
        working-directory: src-tauri
        run: cargo test --test sync_core
      - name: Build (instalator NSIS)
        run: npx tauri build

      # PowerDesk (natywny, Slint). Klucz aktualizacji (token tylko do odczytu tego repozytorium)
      # z sekretu POWERDESK_UPDATE_TOKEN trafia do programu – prywatne wydania są bez niego niewidoczne.
      - name: Build PowerDesk
        env:
          POWERDESK_VERSION: ${{ steps.ver.outputs.version }}
          POWERDESK_UPDATE_TOKEN: ${{ secrets.POWERDESK_UPDATE_TOKEN }}
        run: cargo build --release -p powerdesk

      - name: Pliki wydania
        shell: pwsh
        env:
          WIN_CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
          WIN_CERT_PASS: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory out | Out-Null
          Copy-Item "target/release/bundle/nsis/*.exe" "out/OpenFilePower-$v-setup.exe"
          Copy-Item "target/release/openfilepower-win.exe" "out/OpenFilePower-$v-portable.exe"
          Copy-Item "target/release/powerdesk.exe" "out/PowerDesk-$v.exe"
          # Podpis cyfrowy (bez ostrzeżeń SmartScreen) – tylko gdy w sekretach repozytorium jest certyfikat:
          # WINDOWS_CERTIFICATE (plik .pfx w base64) i WINDOWS_CERTIFICATE_PASSWORD.
          if ($env:WIN_CERT) {
            $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CERT))
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
            & $signtool.FullName sign /f $pfx /p $env:WIN_CERT_PASS /fd sha256 /tr http://timestamp.digicert.com /td sha256 /d "OpenFilePower" (Get-ChildItem out/*.exe).FullName
            if ($LASTEXITCODE -ne 0) { throw "Podpisywanie nie powiodło się" }
            Remove-Item $pfx
          }
          Get-FileHash out/*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OpenFilePower-${{ steps.ver.outputs.version }}
          path: out/*

      - name: Wydanie
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip release]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "v${{ steps.ver.outputs.version }}"
          $notes = "Automatyczne wydanie z commita ${{ github.sha }}.`n`n**Instalator:** OpenFilePower-*-setup.exe (bez uprawnień administratora)`n**PowerDesk:** PowerDesk-*.exe (aktualizuje się sam)`n**Wersja przenośna:** OpenFilePower-*-portable.exe (wymaga WebView2, obecnego w Windows 10/11)"
          gh release create $v out/* --title "OpenFilePower $v" --notes $notes --target ${{ github.sha }}
