[workspace]
resolver = "2"
members = ["core", "app"]

# Wydanie: „thin” LTO i równoległe generowanie kodu – kilka razy krótsza budowa w CI,
# a program praktycznie tak samo szybki (pełne LTO + 1 jednostka: ok. 15 min samego PowerDesk).
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "unwind"
strip = true

# W buildzie dev zależności (Slint, renderer, dekodery obrazów) kompilujemy z optymalizacją –
# bez tego przewijanie i rysowanie w wersji debug wyraźnie się przycina.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
