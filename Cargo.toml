[workspace]
resolver = "2"
members = ["core", "src-tauri", "app"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true

# W buildzie dev zależności (Slint, renderer, dekodery obrazów) kompilujemy z optymalizacją –
# bez tego przewijanie i rysowanie w wersji debug wyraźnie się przycina.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
