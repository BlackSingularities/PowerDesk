[package]
name = "powerdesk-dialog"
version = "1.0.0"
description = "PowerDesk – okna „Otwórz” i „Zapisz jako” w innych programach (serwer COM w procesie programu)"
authors = ["adam001d"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "powerdesk_dialog"
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
windows-core = "0.61"

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
]
